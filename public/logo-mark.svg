      <rect width="48" height="76" rx="7" fill="url(#blue)" stroke="#45b4ff"/>
      <g fill="#fff">
        <rect x="12" y="15" width="25" height="6" rx="1"/><rect x="12" y="21" width="7" height="14" rx="1"/><rect x="12" y="33" width="25" height="6" rx="1"/>
        <rect x="30" y="38" width="7" height="15" rx="1"/><rect x="12" y="51" width="25" height="6" rx="1"/>
      </g>
