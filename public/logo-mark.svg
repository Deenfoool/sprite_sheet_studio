<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 110" fill="none">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="180%" height="190%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#020812" flood-opacity=".5"/>
    </filter>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1498ff"/><stop offset="1" stop-color="#0669e9"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d2aa"/><stop offset="1" stop-color="#0a987a"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#33445c"/><stop offset="1" stop-color="#172234"/></linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <g transform="translate(104 12) skewY(-7)">
      <rect x="4" y="5" width="48" height="76" rx="7" fill="#0d1522" opacity=".65"/>
      <rect width="48" height="76" rx="7" fill="url(#dark)" stroke="#40516a"/>
      <g fill="#fff">
        <rect x="12" y="15" width="25" height="6" rx="1"/><rect x="12" y="21" width="7" height="14" rx="1"/><rect x="12" y="33" width="25" height="6" rx="1"/>
        <rect x="30" y="38" width="7" height="15" rx="1"/><rect x="12" y="51" width="25" height="6" rx="1"/>
      </g>
      <g fill="#d9e2ef" opacity=".7"><rect x="14" y="13" width="6" height="3"/><rect x="30" y="30" width="6" height="3"/><rect x="14" y="48" width="6" height="3"/></g>
    </g>

    <g transform="translate(63 10) skewY(-7)">
      <rect x="4" y="5" width="48" height="76" rx="7" fill="#073d33" opacity=".45"/>
      <rect width="48" height="76" rx="7" fill="url(#green)" stroke="#38ddba"/>
      <g fill="#fff">
        <rect x="12" y="15" width="25" height="6" rx="1"/><rect x="12" y="21" width="7" height="14" rx="1"/><rect x="12" y="33" width="25" height="6" rx="1"/>
        <rect x="30" y="38" width="7" height="15" rx="1"/><rect x="12" y="51" width="25" height="6" rx="1"/>
      </g>
      <g fill="#dffaf3" opacity=".78"><rect x="14" y="13" width="6" height="3"/><rect x="30" y="30" width="6" height="3"/><rect x="14" y="48" width="6" height="3"/></g>
    </g>

