  <g fill="#299cff"><rect x="5" y="38" width="5" height="5"/><rect x="10" y="48" width="4" height="4"/><rect x="4" y="58" width="4" height="4"/></g>
  <g fill="#46576f"><rect x="163" y="36" width="5" height="5"/><rect x="169" y="48" width="4" height="4"/><rect x="163" y="61" width="4" height="4"/></g>
